# Project configuration for scripts/task-audit.sh and scripts/gate.sh.
# Sourced by bash. Every command is run from the repository root.

PROFILE=prototype                 # production | prototype
MAIN=main                         # the branch development is linear on
REMOTE=origin
PLAN=docs/IMPLEMENTATION_PLAN.md

# Green, checked on every task/batch commit (small-scale tier). One per line.
CHECKS=(
  "cargo fmt --all --check"
  "cargo clippy --all-targets -- -D warnings"
  "cargo test"
)

# Added at the phase gate only (full-scale tier): release build, feature sets...
GATE_CHECKS=(
  "cargo build --release"
)

# The suite whose result lines are compared across three runs for determinism.
# Leave empty to skip. The sed strips timings so identical runs compare equal.
DETERMINISM_CMD="cargo test"
DETERMINISM_FILTER="grep -E '^test result:' | sed 's/; finished in .*//' | sort"

# Paths no task may modify: the normative authority and the test data.
PROTECTED_RE='^(docs/reference/|data/)'

# Required commit trailer, as a regex over the message lines.
TRAILER_RE='^Co-Authored-By: Claude'

# Task ids: T<phase>.<n>. Phase-level commits use P<phase>:.
ID_RE='T[0-9]+\.[0-9]+'
